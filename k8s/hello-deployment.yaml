apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hello-pod
  name: hello-pod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-pod
  template:
    metadata:
      labels:
        app: hello-pod
    spec:
      containers:
        - image: hello:3
          name: hello
